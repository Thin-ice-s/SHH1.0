[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shh-ai-bridge"
version = "1.0.1"
description = "Smart Host Hub - Windows AI Remote Bridge, Dynamic Tunnel & MCP Server"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Arena Developer"}
]
keywords = ["ssh", "mcp", "ai-agent", "tunnel", "windows", "remote-dev", "vision"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "paramiko>=3.0.0",
    "pillow>=9.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "websockets>=11.0"
]

[project.scripts]
shh = "shh.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shh*"]
